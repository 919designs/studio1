<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="./Assets/styles_main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="contact-page">
  <header class="site-header">
    <a class="site-logo" href="./index.html" aria-label="Home">
      <img src="./Assets/s919d_logo.png?v=2" alt="Company Logo">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./gallery.html">Gallery</a>
      <a href="./services.html">Services</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>
  <main class="contact-layout">
    <section class="home-column" aria-labelledby="contact-title">
      <h1 id="contact-title">Let's Create<br /><span class="contact-word">Together</span></h1>
      <h2>Turn your vision into something extraordinary.</h2>
    </section>
    <div class="contact-visual">
      <img class="contact-graphic" src="./Assets/contact_bkgrnd.svg" alt="Abstract teal and navy contact graphic">
        <form class="contact-form" action="https://formspree.io/f/maeopqaq" method="POST">
        <h2>Tell us about your next project.</h2>
        <input type="text" id="name" name="name" placeholder="Your name" aria-label="Your name" required>
        <input type="email" id="email" name="email" placeholder="Your email" aria-label="Your email" required>
        <textarea id="message" name="message" placeholder="Message" aria-label="Your message" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </main>
  <section class="gallery-grid-section" aria-label="Design portfolio">
  <div class="gallery-grid" id="gallery-grid">

    <div class="gallery-card">
      <a href="#image-01">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/01-promo-thumb.png" alt="Branding project">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">01</span>
        <span>Branding Project</span>
      </div>
    </div>

    <div class="gallery-card">
      <a href="#image-02">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/02-packaging-thumb.png" alt="Packaging design">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">02</span>
        <span>Packaging Design</span>
      </div>
    </div>

    <div class="gallery-card">
      <a href="#image-03">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/03-posters-thumb.png" alt="Festival posters">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">03</span>
        <span>Festival Posters</span>
      </div>
    </div>

    <div class="gallery-card">
      <a href="#image-04">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/04-promo-thumb.png" alt="Promotional design">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">04</span>
        <span>Promotional Design</span>
      </div>
    </div>

    <div class="gallery-card">
      <a href="#image-05">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/05-personal-thumb.png" alt="Personal project">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">05</span>
        <span>Personal Project</span>
      </div>
    </div>

    <div class="gallery-card">
      <a href="#image-06">
        <img src="./Assets/Assets/Gallery Images/00-thumbnail-images/06-signs-thumb.png" alt="Signage design">
      </a>
      <div class="gallery-caption">
        <span class="gallery-number">06</span>
        <span>Signage Design</span>
      </div>
    </div>

  </div>
</section>
  <!-- Image Lightboxes -->

<div class="lightbox" id="image-01">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/01-branding-big.png" alt="Branding project">
</div>

<div class="lightbox" id="image-02">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/02-packaging-big.png" alt="Packaging design">
</div>

<div class="lightbox" id="image-03">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/03-posters-big.png" alt="Festival posters">
</div>

<div class="lightbox" id="image-04">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/04-promo-big.png" alt="Promotional design">
</div>

<div class="lightbox" id="image-05">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/05-personal-big.png" alt="Personal project">
</div>

<div class="lightbox" id="image-06">
  <a href="#gallery-grid" class="lightbox-close">&times;</a>
  <img src="./Assets/Assets/Gallery Images/enlarged-images/06-signs-big.png" alt="Signage design">
</div>
</body>
</html>
