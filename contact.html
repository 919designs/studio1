<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="./Assets/styles_main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="contact-page">
  <header class="site-header">
    <a class="site-logo" href="./index.html" aria-label="Home">
      <img src="./Assets/s919d_logo.png?v=2" alt="Company Logo">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="./index.html">Home</a>
      <a href="./about.html">About</a>
      <a href="./gallery.html">Gallery</a>
      <a href="./services.html">Services</a>
      <a href="./contact.html">Contact</a>
    </nav>
  </header>
  <main class="contact-layout">
    <section class="home-column" aria-labelledby="contact-title">
      <h1 id="contact-title">Let's Create<br /><span class="contact-word">Together</span></h1>
      <h2>Turn your vision into something extraordinary.</h2>
    </section>
    <div class="contact-visual">
      <img class="contact-graphic" src="./Assets/contact_bkgrnd.svg" alt="Abstract teal and navy contact graphic">
      <form class="contact-form" action="welcome.php" method="post">
        <h2>Tell us about your next project.</h2>
        <input type="text" id="name" name="name" placeholder="Your name" aria-label="Your name" required>
        <input type="email" id="email" name="email" placeholder="Your email" aria-label="Your email" required>
        <textarea id="message" name="message" placeholder="Message" aria-label="Your message" required></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </main>
  <section class="gallery-image-section" aria-label="Gallery image">
    <img class="gallery-image" src="./Assets/gallery_mock-up.png?v=2" alt="Gallery design mock-up">
  </section>
</body>
</html>
